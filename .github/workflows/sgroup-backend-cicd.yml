name: CI/CD - SGroup Backend Basic 2026

on:
  push:
    branches: 
      - main
  
jobs:
  ci:
    name: CI - Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Pull source code from Repository to Github Runner
        uses: actions/checkout@v4

      - name: Configuration Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Verify syntax 
        run: |
          node --check src/index.js
          echo "OK"

  build-and-push:
    name: CD - Build & Push Docker Image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Pull source code from Repository to Github Runner
        uses: actions/checkout@v4

      - name: Setup Docker Buildx 
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub 
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image & Push on Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sgroup-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sgroup-backend:${{ github.sha }}

  deploy-to-ec2:
    name: CD - Deploy to AWS EC2 via SSH 
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Connect SSH to EC2 and update container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "============================================"
            echo "[CI/CD] Start update new version on AWS EC2"
            echo "============================================"

            cd ~/app

            echo "Pull Image latest from Docker Hub....."
            docker compose pull backend

            docker compose up -d --no-deps backend

            docker image prune -f

            docker compose ps

            echo "============================================="
            echo "[CI/CD] Implement successfully on AWS EC2"
            echo "============================================="
